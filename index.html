<title>コードブック</title>
<style>
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface-2:#F0EFEA; --border:#DDD9D0;
  --text:#23211D; --text-dim:#75716A; --accent:#14806E; --danger:#C0392B;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --chord-size:16px; --lyric-size:13px; --lane-h:22px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  overscroll-behavior:none;}
.hidden{display:none;}
.screen{display:none; min-height:100vh; padding-bottom:env(safe-area-inset-bottom);}
.screen.active{display:block;}
.topbar{position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 10px 10px; background:var(--bg); border-bottom:1px solid var(--border);}
.topbar h1{font-size:18px; margin:0;}
.topbar-title{flex:1; text-align:center; overflow:hidden;}
.topbar-title > div:first-child{font-size:16px; font-weight:700; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;}
.topbar-sub{font-size:12px; color:var(--text-dim);}
.topbar-actions{display:flex; gap:2px;}
.icon-btn{background:none; border:none; color:var(--text); font-size:20px; padding:6px 10px; border-radius:8px; cursor:pointer;}
.icon-btn:active{background:var(--surface-2);}
.btn-save{background:var(--accent); color:#FFFFFF; border:none; font-weight:700; padding:8px 16px; border-radius:8px; font-size:14px; cursor:pointer;}

/* 曲一覧 */
.song-list{padding:14px; display:flex; flex-direction:column; gap:10px;}
.song-card{display:flex; align-items:center; justify-content:space-between; background:var(--surface);
  border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer;}
.song-card-title{font-size:16px; font-weight:700;}
.song-card-sub{font-size:13px; color:var(--text-dim); margin-top:2px;}
.empty-state{padding:60px 20px; text-align:center; color:var(--text-dim); line-height:1.7;}

/* 表示画面: セクションごとに1本の横棒(画面幅いっぱい)、3レーン(リフ/コード/歌詞) */
.display-body{padding:16px 16px 60px;}
.section-block{margin-bottom:10px;}
.section-row{display:flex; align-items:stretch; gap:8px;}
.section-line-label{flex:0 0 auto; width:32px; display:flex; align-items:center; justify-content:center;
  border-radius:8px; font-weight:700; font-size:13px;}
.section-line{flex:1; min-width:0; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:8px 14px; position:relative;}
.lane{position:relative; height:var(--lane-h);}
.lane-riff{margin-bottom:2px;}
.lane-chord{border-bottom:1px dashed var(--border); margin-bottom:2px;}
.lane-lyric{}
.ro-item{position:absolute; top:50%; transform:translate(-50%,-50%); white-space:nowrap;}
.ro-item.item-chord{font-family:var(--mono); font-weight:700; font-size:var(--chord-size); color:var(--text);}
.ro-item.item-lyric{font-size:var(--lyric-size); color:var(--text-dim);}
.ro-item.item-riff-marker{width:13px; height:13px; border-radius:50%; background:var(--accent); cursor:pointer;
  box-shadow:0 0 0 2px var(--surface);}
.empty-inline{color:var(--text-dim); font-size:13px; padding:10px 0;}

/* オーバーレイ(設定/リフ/確認/追加メニュー) */
.overlay{position:fixed; inset:0; background:rgba(20,20,15,.4); display:flex; align-items:flex-end; z-index:50;}
.overlay.hidden{display:none;}
.sheet-card{background:var(--surface); width:100%; max-height:85vh; overflow-y:auto; border-radius:16px 16px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow:0 -8px 24px rgba(0,0,0,.15);}
.sheet-head{display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:700; margin-bottom:12px;}
.btn-block{width:100%; padding:12px; border-radius:10px; border:none; background:var(--surface-2); color:var(--text);
  font-size:15px; font-weight:600; margin:6px 0; cursor:pointer; text-align:left;}
.setting-row{display:flex; flex-direction:column; gap:6px; margin:14px 0;}
.setting-row label{font-size:13px; color:var(--text-dim);}
input[type=range]{width:100%;}
.setting-row-buttons{display:flex; gap:10px; margin-top:10px;}
.btn-secondary{flex:1; background:var(--surface-2); color:var(--text); border:1px solid var(--border);
  padding:10px 8px; border-radius:10px; cursor:pointer; font-size:13px;}
hr{border:none; border-top:1px solid var(--border); margin:16px 0;}

.riff-body{margin-top:6px;}
.tab-display{font-family:var(--mono); background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
  padding:14px; white-space:pre; overflow-x:auto; font-size:15px; line-height:1.6;}
.memo-display{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px;
  font-size:15px; line-height:1.7; white-space:pre-wrap;}
.tab-display-grid{display:grid; gap:2px; overflow-x:auto; padding:6px 2px;}
.tab-string-label{display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; color:var(--text-dim);}
.tab-cell-ro{background:var(--surface-2); border:1px solid var(--border); border-radius:4px; height:32px;
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:14px;}

.riff-type-toggle{display:flex; gap:8px; margin:12px 0;}
.toggle-btn{flex:1; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text-dim); cursor:pointer; font-weight:600; font-size:14px;}
.toggle-btn.active{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}
#riff-editor-memo-textarea{width:100%; min-height:120px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-family:var(--mono); font-size:14px; padding:10px; margin-bottom:12px;}
.riff-editor-actions{display:flex; justify-content:space-between; gap:10px;}
.btn-primary{background:var(--accent); color:#FFFFFF; font-weight:700; border:none; padding:10px 18px; border-radius:10px; cursor:pointer; font-size:14px;}
.btn-danger{background:var(--danger); color:#FFFFFF; font-weight:700; border:none; padding:10px 18px; border-radius:10px; cursor:pointer; font-size:14px;}
.btn-danger-outline{background:none; border:1px solid var(--danger); color:var(--danger); padding:10px 14px; border-radius:10px; cursor:pointer; font-size:14px;}

.tab-steps-control{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; color:var(--text-dim);}
.tab-grid-wrap{overflow-x:auto; margin-bottom:10px; padding-bottom:4px;}
.tab-grid{display:grid; gap:2px;}
.tab-cell{width:32px; height:32px; background:var(--surface-2); border:1px solid var(--border); border-radius:4px;
  color:var(--text); font-family:var(--mono); font-size:14px; cursor:pointer;}
.tab-cell.selected{border-color:var(--accent); background:rgba(20,128,110,0.16);}
.fret-pad-wrap{margin-bottom:12px;}
.fret-pad{display:flex; gap:4px; overflow-x:auto; padding-bottom:4px;}
.fret-pad-btn{flex:0 0 auto; width:32px; height:32px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-family:var(--mono); font-size:13px; cursor:pointer;}
.fret-pad-btn.clear{width:auto; padding:0 10px; color:var(--danger); border-color:var(--danger);}

.confirm-message{font-size:15px; line-height:1.7; white-space:pre-line; margin:6px 0 20px;}
#confirm-cancel-btn{flex:0 0 auto; padding:10px 16px;}
#item-editor-input{width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:16px; margin-bottom:16px;}
.picker-section-label{font-size:12px; color:var(--text-dim); margin:14px 0 6px; font-weight:600;}
.picker-btn-row{display:flex; flex-wrap:wrap; gap:6px;}
.picker-btn{padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-family:var(--mono); font-size:15px; cursor:pointer; font-weight:600;}
.picker-btn.selected{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}
.chord-preview{text-align:center; font-family:var(--mono); font-size:32px; font-weight:800; padding:10px 0; color:var(--text);}
.chord-history-chip{padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-family:var(--mono); font-weight:700; font-size:14px; cursor:pointer;}

/* 編集画面 */
.edit-body{padding:14px 14px 60px;}
.edit-body > label{display:block; font-size:13px; color:var(--text-dim); margin-top:14px; margin-bottom:4px;}
.edit-body > input{width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:15px;}
.edit-section{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--sec-color);
  border-radius:10px; padding:12px; margin-top:16px;}
.edit-section-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.edit-section-head select, .custom-label-input{padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:14px;}
.edit-section-move{margin-left:auto; display:flex; gap:4px;}
.mini-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:6px;
  padding:6px 9px; font-size:13px; cursor:pointer;}
.mini-btn.active{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}
.mini-btn.danger{color:var(--danger); border-color:var(--danger);}
.btn-mini-block{margin-top:10px; width:100%; padding:8px; border-radius:8px; border:1px dashed var(--border);
  background:none; color:var(--text-dim); cursor:pointer; font-size:13px;}
.edit-item{position:absolute; top:50%; transform:translate(-50%,-50%); touch-action:none; cursor:pointer;
  user-select:none; -webkit-user-select:none; white-space:nowrap;}
.edit-item.item-chord{font-family:var(--mono); font-weight:700; font-size:13px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:6px; padding:2px 7px;}
.edit-item.item-lyric{font-size:12px; background:var(--surface-2); border:1px solid var(--border);

<body>

<script>
/* ===== セクション種別の定義(色・明るいテーマ用) ===== */
const DEFAULT_SECTION_TYPES = {
  intro:     {label:'イントロ',  abbr:'In',  color:'#5B7DB1'},
  a:         {label:'Aメロ',    abbr:'A',   color:'#0F8577'},
  b:         {label:'Bメロ',    abbr:'B',   color:'#B8791A'},
  chorus:    {label:'サビ',     abbr:'C',   color:'#C1433D'},
  interlude: {label:'間奏',     abbr:'Br',  color:'#7C5CBF'},
  outro:     {label:'アウトロ',  abbr:'Out', color:'#5B6472'},
  custom:    {label:'自由入力', abbr:'',    color:'#5B5F66'}
};
const TYPE_COLOR_PALETTE = ['#5B7DB1','#0F8577','#B8791A','#C1433D','#7C5CBF','#5B6472','#9C6B3F','#3F7CAC','#8A6BBF','#4F8A5B','#B0555E','#6B8E4E'];
let sectionTypes = {};
function hexToRgba(hex, alpha){
  const h = (hex||'#5B5F66').replace('#','');
  const r = parseInt(h.substring(0,2),16)||0;
  const g = parseInt(h.substring(2,4),16)||0;
  const b = parseInt(h.substring(4,6),16)||0;
  return `rgba(${r},${g},${b},${alpha})`;
}
function pickNextColor(){
  const used = Object.values(sectionTypes).map(t=>t.color);
  return TYPE_COLOR_PALETTE.find(c=>!used.includes(c)) || TYPE_COLOR_PALETTE[Math.floor(Math.random()*TYPE_COLOR_PALETTE.length)];
}
const STRING_LABELS = ['e','B','G','D','A','E'];

/* ===== 状態 ===== */
let songs = [];
let settings = {chordSize:16, lyricSize:13, laneHeight:22};
let currentSongId = null;
let editingSong = null;
let isNewSong = false;
let originalSongSnapshot = null;
let riffEditorContext = null; // {secId, itemId}
let riffEditorType = 'tab';
let tabEditorSteps = 8;
let tabEditorGrid = [];
let selectedCell = null;
let confirmResolve = null;
let itemEditorContext = null; // {secId, itemId}
let addItemContext = null; // {secId}
let dragState = null;

/* ===== ユーティリティ ===== */
function uid(){ return 'id-' + Math.random().toString(36).slice(2,9); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clampPos(p){
  p = Number(p);
  if(isNaN(p)) p = 50;
  return Math.max(0, Math.min(100, p));
}
function sectionMeta(sec){
  const base = sectionTypes[sec.type] || sectionTypes.custom;
  const isCustom = sec.type==='custom' && sec.customLabel;
  return {
    label: isCustom ? sec.customLabel : base.label,
    abbr: isCustom ? sec.customLabel : base.abbr,
    color: base.color,
    bg: hexToRgba(base.color, 0.14)
  };
}
function findItem(secId, itemId){
  const sec = editingSong.sections.find(s=>s.id===secId);
  return sec.items.find(it=>it.id===itemId);
}

/* 共通確認ダイアログ(プレビュー内でも確実に動くよう、標準のconfirm/alertは使わない) */
function showConfirm(message, opts){
  opts = opts || {};
  const okText = opts.okText || 'OK';
  const cancelText = opts.cancelText || 'キャンセル';
  const danger = !!opts.danger;
  const okOnly = !!opts.okOnly;
  return new Promise(resolve=>{
    confirmResolve = resolve;
    document.getElementById('confirm-message').textContent = message;
    const okBtn = document.getElementById('confirm-ok-btn');
    const cancelBtn = document.getElementById('confirm-cancel-btn');
    okBtn.textContent = okText;
    okBtn.className = danger ? 'btn-danger' : 'btn-primary';
    cancelBtn.textContent = cancelText;
    cancelBtn.style.display = okOnly ? 'none' : 'inline-block';
    document.querySelector('#confirm-modal .riff-editor-actions').style.justifyContent = okOnly ? 'flex-end' : 'space-between';
    document.getElementById('confirm-modal').classList.remove('hidden');
  });
}

/* ===== サンプルデータ(初回起動時のみ) ===== */
function sampleSongs(){
  return [
    {id:uid(), title:'サンプルソング1', key:'G', sections:[
      {id:uid(), type:'intro', customLabel:'', items:[
        {id:uid(), type:'chord', pos:10, value:'G'},
        {id:uid(), type:'riff', pos:10, riff:{type:'tab', steps:4, grid:[
          [3,null,null,null],[null,0,null,null],[null,null,0,null],
          [null,null,null,null],[null,null,null,null],[null,null,null,null]
        ]}},
        {id:uid(), type:'chord', pos:45, value:'C'},
        {id:uid(), type:'chord', pos:75, value:'G'}
      ]},
      {id:uid(), type:'a', customLabel:'', items:[
        {id:uid(), type:'chord', pos:5, value:'G'}, {id:uid(), type:'lyric', pos:5, value:'ラララ'},
        {id:uid(), type:'chord', pos:30, value:'D'}, {id:uid(), type:'lyric', pos:30, value:'ラララ'},
        {id:uid(), type:'chord', pos:55, value:'Em'}, {id:uid(), type:'lyric', pos:55, value:'ラララ'},
        {id:uid(), type:'chord', pos:78, value:'C'}, {id:uid(), type:'chord', pos:92, value:'G'}, {id:uid(), type:'lyric', pos:80, value:'ラララ'}
      ]},
      {id:uid(), type:'chorus', customLabel:'', items:[
        {id:uid(), type:'chord', pos:5, value:'C'}, {id:uid(), type:'lyric', pos:5, value:'ラララ'},
        {id:uid(), type:'chord', pos:35, value:'G'}, {id:uid(), type:'lyric', pos:35, value:'ラララ'},
        {id:uid(), type:'riff', pos:45, riff:{type:'memo', content:'ハイポジションでチョーキング。\n半音上げてすぐ戻す。'}},
        {id:uid(), type:'chord', pos:65, value:'D'}, {id:uid(), type:'lyric', pos:65, value:'ラララ'},
        {id:uid(), type:'chord', pos:90, value:'Em'}, {id:uid(), type:'lyric', pos:90, value:'ラララ'}
      ]}
    ]},
    {id:uid(), title:'サンプルソング2', key:'Am', sections:[
      {id:uid(), type:'a', customLabel:'', items:[
        {id:uid(), type:'chord', pos:20, value:'Am'}, {id:uid(), type:'lyric', pos:20, value:'ラララ'},
        {id:uid(), type:'chord', pos:70, value:'F'}, {id:uid(), type:'lyric', pos:70, value:'ラララ'}
      ]}
    ]}
  ];
}

/* 旧データ形式を新形式(セクション直下のitems配列, 小節の概念なし)へ変換 */
function migrateSongs(list){
  (list||[]).forEach(song=>{
    (song.sections||[]).forEach(sec=>{
      if(sec.items) return; // 既に新形式
      const bars = sec.bars || [];
      bars.forEach(bar=>{
        if(bar.items) return;
        let chordList = bar.chords || (bar.chord!=null ? [bar.chord] : []);
        const items = [];
        const n = chordList.length;
        chordList.forEach((c,i)=>{
          const pos = n>0 ? Math.round(((i+0.5)/n)*100) : 50;
          items.push({id:uid(), type:'chord', pos, value:c||''});
        });
        if(bar.lyric){ items.push({id:uid(), type:'lyric', pos:0, value:bar.lyric}); }
        if(bar.riff){ items.push({id:uid(), type:'riff', pos:50, riff:bar.riff}); }
        bar.items = items;
      });
      const totalBars = bars.length;
      const flatItems = [];
      bars.forEach((bar, bi)=>{
        (bar.items||[]).forEach(it=>{
          const localPos = clampPos(it.pos);
          const globalPos = totalBars>0 ? Math.round(((bi + localPos/100) / totalBars) * 100) : 50;
          flatItems.push(Object.assign({}, it, {pos: globalPos}));
        });
      });
      sec.items = flatItems;
      delete sec.bars;
    });
  });
  return list;
}

/* ===== データ読み書き ===== */
function loadData(){
  loadSectionTypes();
  try{ songs = JSON.parse(localStorage.getItem('cb_songs')||'null') || sampleSongs(); }
  catch(e){ songs = sampleSongs(); }
  migrateSongs(songs);
  try{ settings = Object.assign({chordSize:16,lyricSize:13,laneHeight:22}, JSON.parse(localStorage.getItem('cb_settings')||'{}')); }
  catch(e){}
  applySettings();
}
function loadSectionTypes(){
  try{ sectionTypes = JSON.parse(localStorage.getItem('cb_section_types')||'null') || JSON.parse(JSON.stringify(DEFAULT_SECTION_TYPES)); }
  catch(e){ sectionTypes = JSON.parse(JSON.stringify(DEFAULT_SECTION_TYPES)); }
}
function saveSectionTypes(){ localStorage.setItem('cb_section_types', JSON.stringify(sectionTypes)); }
function saveSongs(){ localStorage.setItem('cb_songs', JSON.stringify(songs)); }
function saveSettings(){ localStorage.setItem('cb_settings', JSON.stringify(settings)); }
function applySettings(){
  document.documentElement.style.setProperty('--lane-h', settings.laneHeight+'px');
  document.documentElement.style.setProperty('--chord-size', settings.chordSize+'px');
  document.documentElement.style.setProperty('--lyric-size', settings.lyricSize+'px');
}

/* ===== 画面切り替え ===== */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}

/* ===== 曲一覧 ===== */
function renderLibrary(){
  const list = document.getElementById('song-list');
  if(songs.length===0){
    list.innerHTML = '<div class="empty-state">曲がありません。<br>右上の＋から追加してください。</div>';
    return;
  }
  list.innerHTML = songs.map(s=>`
    <div class="song-card" onclick="openDisplay('${s.id}')">
      <div>
        <div class="song-card-title">${escapeHtml(s.title||'無題')}</div>
        <div class="song-card-sub">${escapeHtml(s.key||'Key未設定')} ・ ${s.sections.length}セクション</div>
      </div>
      <button class="icon-btn" onclick="event.stopPropagation(); openEdit('${s.id}')">✎</button>
    </div>
  `).join('');
}
function createNewSong(){
  editingSong = {id:uid(), title:'', key:'', sections:[]};
  isNewSong = true;
  originalSongSnapshot = JSON.stringify(editingSong);
  document.getElementById('edit-header-title').textContent = '新しい曲';
  document.getElementById('delete-song-btn').style.display = 'none';
  renderEdit();
  showScreen('edit');
}

/* ===== コード表示画面 ===== */
function openDisplay(id){
  currentSongId = id;
  renderDisplay();
  showScreen('display');
}
function renderDisplay(){
  const song = songs.find(s=>s.id===currentSongId);
  if(!song) return;
  document.getElementById('display-title').textContent = song.title || '無題';
  document.getElementById('display-key').textContent = song.key ? 'Key: '+song.key : '';
  const body = document.getElementById('display-body');
  if(song.sections.length===0){
    body.innerHTML = '<div class="empty-state">セクションがありません。<br>✎ボタンから編集して追加してください。</div>';
    return;
  }
  body.innerHTML = song.sections.map(sec=>{
    const meta = sectionMeta(sec);
    return `<div class="section-block">${renderSectionLineReadonly(sec, meta)}</div>`;
  }).join('');
}
function renderSectionLineReadonly(sec, meta){
  const items = sec.items || [];
  const labelHtml = `<span class="section-line-label" style="background:${meta.bg}; color:${meta.color}">${escapeHtml(meta.abbr)}</span>`;
  if(items.length===0){
    return `<div class="section-row">${labelHtml}<div class="section-line"><div class="empty-inline">要素なし</div></div></div>`;
  }
  const riffHtml = items.filter(it=>it.type==='riff').map(it=>
    `<div class="ro-item item-riff-marker" style="left:${clampPos(it.pos)}%" onclick="openRiffViewByIds('${sec.id}','${it.id}')"></div>`
  ).join('');
  const chordHtml = items.filter(it=>it.type==='chord').map(it=>
    `<div class="ro-item item-chord" style="left:${clampPos(it.pos)}%">${escapeHtml(it.value||'—')}</div>`
  ).join('');
  const lyricHtml = items.filter(it=>it.type==='lyric').map(it=>
    `<div class="ro-item item-lyric" style="left:${clampPos(it.pos)}%">${escapeHtml(it.value||'')}</div>`
  ).join('');
  return `
    <div class="section-row">
      ${labelHtml}
      <div class="section-line">
        <div class="lane lane-riff">${riffHtml}</div>
        <div class="lane lane-chord">${chordHtml}</div>
        <div class="lane lane-lyric">${lyricHtml}</div>
      </div>
    </div>`;
}

function openEdit(songId){

}
function hasUnsavedChanges(){
  return JSON.stringify(editingSong) !== originalSongSnapshot;
}
function renderEdit(){
  document.getElementById('edit-title').value = editingSong.title||'';
  document.getElementById('edit-key').value = editingSong.key||'';
  const container = document.getElementById('edit-sections');
  container.innerHTML = editingSong.sections.map((sec,si)=>{
    const meta = sectionMeta(sec);
    const options = Object.keys(sectionTypes).map(k=>
      `<option value="${k}" ${sec.type===k?'selected':''}>${escapeHtml(sectionTypes[k].label)}</option>`
    ).join('');
    return `
      <div class="edit-section" style="--sec-color:${meta.color}">
        <div class="edit-section-head">
          <select onchange="updateSectionType('${sec.id}', this.value)">${options}</select>

          <div class="edit-section-move">
            <button class="mini-btn" onclick="moveSection(${si},-1)">↑</button>
            <button class="mini-btn" onclick="moveSection(${si},1)">↓</button>
            <button class="mini-btn danger" onclick="removeSection('${sec.id}')">🗑</button>
          </div>
        </div>
        ${renderEditSectionLine(sec, meta)}
        <button class="btn-mini-block" onclick="openAddItemMenu('${sec.id}')">＋ 要素を追加(コード/歌詞/リフ)</button>
      </div>`;
  }).join('');
  attachAllDragHandlers();
}
function renderEditSectionLine(sec, meta){
  const items = sec.items || [];
  const riffHtml = items.filter(it=>it.type==='riff').map(it=>
    `<div class="edit-item item-riff-marker" data-sec="${sec.id}" data-item="${it.id}" style="left:${clampPos(it.pos)}%"></div>`
  ).join('');
  const chordHtml = items.filter(it=>it.type==='chord').map(it=>
    `<div class="edit-item item-chord" data-sec="${sec.id}" data-item="${it.id}" style="left:${clampPos(it.pos)}%">${escapeHtml(it.value||'?')}</div>`
  ).join('');
  const lyricHtml = items.filter(it=>it.type==='lyric').map(it=>
    `<div class="edit-item item-lyric" data-sec="${sec.id}" data-item="${it.id}" style="left:${clampPos(it.pos)}%">${escapeHtml(it.value||'?')}</div>`
  ).join('');
  return `
    <div class="section-line">
      <div class="lane lane-riff">${riffHtml}</div>
      <div class="lane lane-chord">${chordHtml}</div>
      <div class="lane lane-lyric">${lyricHtml}</div>
    </div>`;
}
function updateSectionType(secId, type){
  editingSong.sections.find(s=>s.id===secId).type = type;
  renderEdit();
}
function updateSectionLabel(secId, label){
  editingSong.sections.find(s=>s.id===secId).customLabel = label;
}
function addSection(){
  editingSong.sections.push({id:uid(), type:'a', customLabel:'', items:[]});
  renderEdit();
}
async function removeSection(secId){
  const ok = await showConfirm('このセクションを削除しますか?', {okText:'削除する', danger:true});
  if(!ok) return;
  editingSong.sections = editingSong.sections.filter(s=>s.id!==secId);
  renderEdit();
}
function moveSection(index, dir){
  const newIndex = index+dir;
  if(newIndex<0 || newIndex>=editingSong.sections.length) return;
  const arr = editingSong.sections;
  [arr[index], arr[newIndex]] = [arr[newIndex], arr[index]];
  renderEdit();
}
function saveSong(){
  editingSong.title = document.getElementById('edit-title').value.trim();
  editingSong.key = document.getElementById('edit-key').value.trim();
  const idx = songs.findIndex(s=>s.id===editingSong.id);
  if(idx>=0){ songs[idx]=editingSong; } else { songs.push(editingSong); }
  saveSongs();
  currentSongId = editingSong.id;
  renderDisplay();
  renderLibrary();
  showScreen('display');
}
async function cancelEdit(){
  if(hasUnsavedChanges()){
    const ok = await showConfirm('編集内容を破棄して戻りますか?\n保存されていない変更は失われます。', {okText:'破棄して戻る', danger:true});
    if(!ok) return;
  }
  renderLibrary();
  if(!isNewSong){ renderDisplay(); showScreen('display'); }
  else{ showScreen('library'); }
}
async function deleteSong(){
  const ok = await showConfirm('この曲を削除しますか?\n元に戻せません。', {okText:'削除する', danger:true});
  if(!ok) return;
  songs = songs.filter(s=>s.id!==editingSong.id);
  saveSongs();
  renderLibrary();

}

/* ===== コードピッカー(テキスト入力ではなく選択式でコードを組み立てる) ===== */
const ROOT_NOTES = ['C','D','E','F','G','A','B'];
const ACCIDENTALS = [{key:'', label:'♮'}, {key:'#', label:'♯'}, {key:'♭', label:'♭'}];
const QUALITIES_MAIN = [
  {key:'', label:'無印'}, {key:'M7', label:'M7'}, {key:'m', label:'m'},
  {key:'m7', label:'m7'}, {key:'7', label:'7'}, {key:'m7♭5', label:'m7♭5'}
];
const QUALITIES_EXTRA = [
  {key:'9', label:'9'}, {key:'sus4', label:'sus4'}, {key:'sus2', label:'sus2'},
  {key:'dim', label:'dim'}, {key:'aug', label:'aug'}, {key:'6', label:'6'}
];
let chordPickerContext = null; // {secId, itemId}
let chordPickerState = {root:'C', accidental:'', quality:''};
function parseChordValue(value){
  const m = /^([A-G])(#|♭)?(.*)$/.exec(value||'');
  if(!m){ return {root:'C', accidental:'', quality:''}; }
  const knownQualities = QUALITIES_MAIN.concat(QUALITIES_EXTRA).map(q=>q.key);
  const rest = m[3]||'';
  return {root:m[1], accidental:m[2]||'', quality: knownQualities.includes(rest) ? rest : ''};
}
function openChordPickerForItem(secId, itemId){
  chordPickerContext = {secId, itemId};
  const item = findItem(secId, itemId);
  chordPickerState = parseChordValue(item.value);
  document.getElementById('chord-history-list').classList.add('hidden');
  renderChordPicker();
  document.getElementById('chord-picker-modal').classList.remove('hidden');
}
function renderChordPicker(){
  document.getElementById('root-btn-row').innerHTML = ROOT_NOTES.map(r=>
    `<button type="button" class="picker-btn ${chordPickerState.root===r?'selected':''}" onclick="setChordPart('root','${r}')">${r}</button>`
  ).join('');
  document.getElementById('accidental-btn-row').innerHTML = ACCIDENTALS.map(a=>
    `<button type="button" class="picker-btn ${chordPickerState.accidental===a.key?'selected':''}" onclick="setChordPart('accidental','${a.key}')">${a.label}</button>`
  ).join('');
  document.getElementById('quality-btn-row').innerHTML = QUALITIES_MAIN.map(q=>
    `<button type="button" class="picker-btn ${chordPickerState.quality===q.key?'selected':''}" onclick="setChordPart('quality','${q.key}')">${q.label}</button>`
  ).join('');
  document.getElementById('quality-extra-btn-row').innerHTML = QUALITIES_EXTRA.map(q=>
    `<button type="button" class="picker-btn ${chordPickerState.quality===q.key?'selected':''}" onclick="setChordPart('quality','${q.key}')">${q.label}</button>`
  ).join('');
  document.getElementById('chord-preview').textContent = buildChordString();
}
function setChordPart(part, value){
  chordPickerState[part] = value;
  renderChordPicker();
}
function buildChordString(){
  return chordPickerState.root + chordPickerState.accidental + chordPickerState.quality;
}
function confirmChordPicker(){
  const item = findItem(chordPickerContext.secId, chordPickerContext.itemId);
  item.value = buildChordString();
  closeChordPicker();
  renderEdit();
}
function deleteChordItem(){

}
function toggleChordHistory(){

function renderChordHistory(){
  const counts = {};
  editingSong.sections.forEach(sec=>{
    (sec.items||[]).forEach(it=>{
      if(it.type==='chord' && it.value){ counts[it.value] = (counts[it.value]||0)+1; }
    });
  });
  const sorted = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const el = document.getElementById('chord-history-list');
  if(sorted.length===0){
    el.innerHTML = '<div class="empty-inline">まだ使われたコードがありません。</div>';
    return;
  }
  el.innerHTML = sorted.map(v=>
    `<button type="button" class="chord-history-chip" data-value="${escapeHtml(v)}" onclick="pickFromHistory(this.dataset.value)">${escapeHtml(v)}</button>`
  ).join('');
}

/* ===== ドラッグで位置移動(長押し→ドラッグ、レーン内のみ) ===== */
function attachAllDragHandlers(){
  document.querySelectorAll('.edit-item').forEach(el=>{
    attachItemDragHandlers(el, el.dataset.sec, el.dataset.item);
  });
}
function attachItemDragHandlers(el, secId, itemId){
  el.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    dragState = {
      el, secId, itemId,
      laneEl: el.parentElement,
      startX: e.clientX, startY: e.clientY,
      dragging: false, pointerId: e.pointerId, newPos: null
    };
    dragState.timer = setTimeout(()=>{
      if(!dragState || dragState.el!==el) return;
      dragState.dragging = true;
      el.classList.add('dragging');
      try{ el.setPointerCapture(dragState.pointerId); }catch(err){}
    }, 380);
  });
  el.addEventListener('pointermove', e=>{
    if(!dragState || dragState.el!==el) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if(!dragState.dragging){
      if(Math.abs(dx)>8 || Math.abs(dy)>8){
        clearTimeout(dragState.timer);
        dragState = null;
      }
      return;
    }
    const rect = dragState.laneEl.getBoundingClientRect();
    const pct = clampPos(((e.clientX - rect.left) / rect.width) * 100);
    el.style.left = pct+'%';
    dragState.newPos = Math.round(pct);
  });
  el.addEventListener('pointerup', ()=>{
    if(!dragState || dragState.el!==el) return;
    clearTimeout(dragState.timer);
    if(dragState.dragging){
      const item = findItem(dragState.secId, dragState.itemId);
      if(item && dragState.newPos!=null) item.pos = dragState.newPos;
      dragState = null;
      renderEdit();
    }else{
      const ctx = dragState;
      dragState = null;
      openItemEditor(ctx.secId, ctx.itemId);
    }
  });
  el.addEventListener('pointercancel', ()=>{
    if(dragState && dragState.el===el){
      clearTimeout(dragState.timer);
      el.classList.remove('dragging');
      dragState = null;
    }
  });
}

/* ===== リフ/オブリガード 編集(TAB=マス目形式, メモ=自由記述) ===== */
function openRiffEditorForItem(secId, itemId){
  riffEditorContext = {secId, itemId};
  const item = findItem(secId, itemId);
  riffEditorType = (item.riff && item.riff.type) || 'tab';
  document.getElementById('riff-editor-memo-textarea').value = (item.riff && item.riff.type==='memo') ? (item.riff.content||'') : '';
  if(item.riff && item.riff.type==='tab' && item.riff.grid){
    tabEditorSteps = item.riff.steps || item.riff.grid[0].length;
    tabEditorGrid = item.riff.grid.map(row=>row.slice());
  }else{
    tabEditorSteps = 8;
    tabEditorGrid = Array.from({length:6}, ()=>Array(tabEditorSteps).fill(null));
  }
  selectedCell = null;
  document.getElementById('fret-pad-wrap').classList.add('hidden');
  document.getElementById('riff-delete-btn').style.display = 'inline-block';
  updateRiffTypeButtons();
  renderTabGrid();
  document.getElementById('riff-editor-modal').classList.remove('hidden');
}
function setRiffEditorType(type){ riffEditorType = type; updateRiffTypeButtons(); }
function updateRiffTypeButtons(){
  document.getElementById('riff-type-tab-btn').classList.toggle('active', riffEditorType==='tab');
  document.getElementById('riff-type-memo-btn').classList.toggle('active', riffEditorType==='memo');
  document.getElementById('riff-tab-editor').classList.toggle('hidden', riffEditorType!=='tab');
  document.getElementById('riff-memo-editor').classList.toggle('hidden', riffEditorType!=='memo');
}
function renderTabGrid(){
  document.getElementById('tab-steps-count').textContent = tabEditorSteps;
  const grid = document.getElementById('tab-grid');
  grid.style.gridTemplateColumns = '24px repeat('+tabEditorSteps+', 32px)';
  let html='';
  for(let s=0;s<6;s++){
    html += `<div class="tab-string-label">${STRING_LABELS[s]}</div>`;
    for(let t=0;t<tabEditorSteps;t++){
      const v = tabEditorGrid[s][t];
      const sel = (selectedCell && selectedCell.s===s && selectedCell.t===t) ? ' selected' : '';
      html += `<button type="button" class="tab-cell${sel}" onclick="selectTabCell(${s},${t})">${v==null?'':v}</button>`;
    }
  }
  grid.innerHTML = html;
}
function selectTabCell(s,t){
  selectedCell = {s,t};
  renderFretPad();
  document.getElementById('fret-pad-wrap').classList.remove('hidden');
  renderTabGrid();
}
function renderFretPad(){
  let html='';
  for(let f=0; f<=24; f++){ html += `<button type="button" class="fret-pad-btn" onclick="assignFret(${f})">${f}</button>`; }
  html += `<button type="button" class="fret-pad-btn clear" onclick="assignFret(null)">クリア</button>`;
  document.getElementById('fret-pad').innerHTML = html;
}
function assignFret(value){
  if(!selectedCell) return;
  tabEditorGrid[selectedCell.s][selectedCell.t] = value;
  if(selectedCell.t+1 < tabEditorSteps){
    selectedCell = {s:selectedCell.s, t:selectedCell.t+1};
  }else{
    selectedCell = null;
    document.getElementById('fret-pad-wrap').classList.add('hidden');
  }
  renderTabGrid();
}
function changeTabSteps(delta){
  const newSteps = Math.max(1, Math.min(32, tabEditorSteps+delta));
  if(newSteps===tabEditorSteps) return;
  for(let s=0;s<6;s++){
    const row = tabEditorGrid[s];
    if(newSteps>tabEditorSteps){ while(row.length<newSteps) row.push(null); }
    else{ row.length = newSteps; }
  }
  tabEditorSteps = newSteps;
  selectedCell = null;
  document.getElementById('fret-pad-wrap').classList.add('hidden');
  renderTabGrid();
}
function saveRiffEditor(){
  const item = findItem(riffEditorContext.secId, riffEditorContext.itemId);
  if(riffEditorType==='tab'){
    const hasNote = tabEditorGrid.some(row=>row.some(v=>v!=null));
    item.riff = hasNote ? {type:'tab', steps:tabEditorSteps, grid:tabEditorGrid.map(r=>r.slice())} : null;
  }else{
    const content = document.getElementById('riff-editor-memo-textarea').value.trim();
    item.riff = content ? {type:'memo', content} : null;
  }
  if(!item.riff){
    const sec = editingSong.sections.find(s=>s.id===riffEditorContext.secId);
    sec.items = sec.items.filter(it=>it.id!==item.id);
  }
  closeRiffEditor();
  renderEdit();
}
function deleteRiff(){
  const sec = editingSong.sections.find(s=>s.id===riffEditorContext.secId);
  sec.items = sec.items.filter(it=>it.id!==riffEditorContext.itemId);
  closeRiffEditor();
  renderEdit();
}
function closeRiffEditor(){
  document.getElementById('riff-editor-modal').classList.add('hidden');
  riffEditorContext = null;
  selectedCell = null;
}

async function deleteType(){

  const ok = await showConfirm(msg, {okText:'削除する', danger:true});
  if(!ok) return;
  delete sectionTypes[key];
  saveSectionTypes();
  closeTypeEditor();
  renderTypeManagerList();
  if(currentSongId){ renderDisplay(); }
}

/* ===== バックアップ ===== */
function exportBackup(){
  const data = JSON.stringify({songs, settings, sectionTypes}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const ymd = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  a.href = url; a.download = `chordbook_backup_${ymd}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const ok = await showConfirm('現在のデータを上書きします。\nよろしいですか?', {okText:'読み込む', danger:true});
  if(!ok){ event.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data.sectionTypes){ sectionTypes = data.sectionTypes; saveSectionTypes(); }
      if(data.songs){ songs = migrateSongs(data.songs); saveSongs(); }
      if(data.settings){ settings = Object.assign(settings, data.settings); saveSettings(); applySettings(); }
      renderLibrary();
      await showConfirm('読み込みが完了しました。', {okOnly:true});
    }catch(err){
      await showConfirm('読み込みに失敗しました。\nファイルの形式を確認してください。', {okOnly:true});
    }
    event.target.value='';
  };
  reader.readAsText(file);
}

/* ===== 初期化 ===== */
window.addEventListener('DOMContentLoaded', ()=>{
  loadData();
  renderLibrary();
  document.getElementById('confirm-ok-btn').addEventListener('click', ()=>{
    document.getElementById('confirm-modal').classList.add('hidden');
    const r = confirmResolve; confirmResolve = null;
    if(r) r(true);
  });
  document.getElementById('confirm-cancel-btn').addEventListener('click', ()=>{
    document.getElementById('confirm-modal').classList.add('hidden');
    const r = confirmResolve; confirmResolve = null;
    if(r) r(false);
  });
});
</script>
